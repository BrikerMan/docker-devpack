name: Build & Push Docker Images

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ${{ secrets.REGISTRY || "gitea.example.com" }}
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    strategy:
      matrix:
        ubuntu: ["22.04", "24.04", "26.04"]
        python: ["3.12", "3.13", "3.14"]
        mirror: [false, true]
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        if: github.event_name != "pull_request"
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Compute tag suffix
        id: tag
        run: |
          SUFFIX=""
          [ "${{ matrix.mirror }}" = "true" ] && SUFFIX="-china"
          echo "suffix=${SUFFIX}" >> "$GITHUB_OUTPUT"

      - name: Determine if latest
        id: latest
        if: matrix.ubuntu == '26.04' && matrix.python == '3.14' && matrix.mirror == false
        run: echo "is_latest=true" >> "$GITHUB_OUTPUT"

      - name: Determine if latest-china
        id: latest_china
        if: matrix.ubuntu == '26.04' && matrix.python == '3.14' && matrix.mirror == true
        run: echo "is_latest_china=true" >> "$GITHUB_OUTPUT"

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.minimal
          build-args: |
            UBUNTU_VERSION=${{ matrix.ubuntu }}
            PYTHON_VERSION=${{ matrix.python }}
            CHINA_MIRROR=${{ matrix.mirror }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != "pull_request" }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:py${{ matrix.python }}-ubuntu${{ matrix.ubuntu }}${{ steps.tag.outputs.suffix }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:py${{ matrix.python }}${{ steps.tag.outputs.suffix }}
            ${{ steps.latest.outputs.is_latest == 'true' && format('{0}/{1}:latest', env.REGISTRY, env.IMAGE_NAME) || '' }}
            ${{ steps.latest_china.outputs.is_latest_china == 'true' && format('{0}/{1}:latest-china', env.REGISTRY, env.IMAGE_NAME) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
